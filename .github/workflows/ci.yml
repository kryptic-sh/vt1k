name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      # vt1k against vt100, ten times as many sessions as a plain test run.
      - run: cargo test --release --test parity
        env:
          VT1K_PARITY_CASES: "3000"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Packaged and built as crates.io would take it, on every push, so a tag
  # never finds a packaging error first.
  package:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: cargo publish --dry-run

  publish-github-release:
    name: Publish GitHub Release
    needs: [fmt, clippy, test, deny, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the crate's version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $VERSION"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - name: Publish (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # NB: crates.io 403s UA-less requests — the probe must send a
          # User-Agent or it never detects an already-published version.
          if curl -fsS -A "vt1k-release-ci" -o /dev/null "https://crates.io/api/v1/crates/vt1k/$VERSION"; then
            echo "vt1k $VERSION already on crates.io — skipping"
            exit 0
          fi
          # Publish with hjkl-style 429 retries: parse crates.io's
          # "try again after" timestamp (11-min fallback), 3 attempts;
          # non-rate-limit failures fail fast.
          attempt=0
          while [ $attempt -lt 3 ]; do
            if cargo publish 2>&1 | tee /tmp/publish.log; then
              exit 0
            fi
            if grep -qiE "429|Too Many Requests" /tmp/publish.log; then
              wait_until=$(grep -oE 'try again after [^.]+' /tmp/publish.log | sed 's/try again after //' || true)
              if [ -n "$wait_until" ]; then
                wait_secs=$(( $(date -d "$wait_until" +%s) - $(date +%s) + 30 ))
                [ "$wait_secs" -lt 30 ] && wait_secs=30
                echo "::warning::rate limited, sleeping ${wait_secs}s until $wait_until"
              else
                wait_secs=660
                echo "::warning::rate limited, sleeping ${wait_secs}s (11 min fallback)"
              fi
              sleep "$wait_secs"
              attempt=$(( attempt + 1 ))
            else
              echo "::error::publish failed (non-rate-limit error)"
              exit 1
            fi
          done
          echo "::error::publish failed after 3 rate-limit retries"
          exit 1
