[graph]
all-features = true

[advisories]
version = 2

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# vt100, for the parity test only (a dev-dependency).
allow-git = ["https://github.com/kryptic-sh/vt100-rust"]
